name: Windows Build Only

on:
  push:
    branches:
      - windows-build-only-20261030

permissions:
  contents: read

env:
  FIREFOX_REV: cebc55aab4d2661d1f6c2d1526362947ec4016c1

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Firefox-Reverse
        uses: actions/checkout@v4
        with:
          path: firefox-reverse

      - name: Checkout pinned Firefox source
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin https://github.com/mozilla-firefox/firefox.git
          git -C upstream fetch --depth 1 origin "$FIREFOX_REV"
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$FIREFOX_REV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install MozillaBuild
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'MozillaBuildSetup-4.2.1.exe'
          Invoke-WebRequest -Uri 'https://archive.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-4.2.1.exe' -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', '/D=C:\mozilla-build') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MozillaBuild installer exited with code $($process.ExitCode)" }
          if (-not (Test-Path 'C:\mozilla-build\msys2')) { throw 'MozillaBuild installation was not found at C:\mozilla-build' }

      - name: Apply Firefox-Reverse patches
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream config apply.ignoreWhitespace change
          UPSTREAM_DIR=upstream PYTHON=python bash firefox-reverse/scripts/apply-patches.sh
          node firefox-reverse/scripts/check-branding-assets.mjs upstream

      - name: Move Firefox source to a short path
        shell: pwsh
        run: Move-Item -LiteralPath upstream -Destination D:\f

      - name: Bootstrap, build, package, and verify
        shell: bash
        working-directory: D:\f
        run: |
          set -euo pipefail
          ./mach --no-interactive bootstrap --application-choice browser
          ./mach configure --with-branding=browser/branding/unofficial
          objdir=$(./mach environment --format json | python -c 'import json,sys; print(json.load(sys.stdin)["topobjdir"])')
          python "$GITHUB_WORKSPACE/firefox-reverse/scripts/verify-branding.py" --objdir "$objdir"
          ./mach build
          ./mach package
          python "$GITHUB_WORKSPACE/firefox-reverse/scripts/verify-branding.py" --package "$objdir/dist/firefox"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: firefox-reverse-windows-x86_64
          path: upstream/obj-*/dist/install/**/firefox-*.zip
          if-no-files-found: error
          retention-days: 14
